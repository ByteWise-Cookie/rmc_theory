<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1240" height="790" fill="#ffffff"/>
  <text x="40" y="38" font-size="15" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">ME single-bit flags (one shared interface) + demand -&gt; scheduler</text>
  <text x="40" y="58" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">7 FSMs live in ONE ME block; it emits single-bit flags on the shared cmd interface (like demand). Scheduler ranks all. INIT = only hard override.</text>
  <rect x="40" y="92" width="290" height="470" fill="none" stroke="#000000" stroke-width="1.4"/>
  <text x="325" y="84" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">MAINTENANCE ENGINE</text>
  <rect x="55" y="126" width="255" height="46" fill="#efe6fb" stroke="#000000" stroke-width="1.4" rx="6"/>
  <text x="182" y="145" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">INIT (16)</text>
  <text x="182" y="161" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">power-on -&gt; init_done</text>
  <rect x="55" y="187" width="255" height="46" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" rx="6"/>
  <text x="182" y="206" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">REFRESH (6)</text>
  <text x="182" y="222" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">leaky bucket</text>
  <rect x="55" y="248" width="255" height="46" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" rx="6"/>
  <text x="182" y="267" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">RFM (6)</text>
  <text x="182" y="283" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">RAA &gt;= RAAIMT</text>
  <rect x="55" y="309" width="255" height="46" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" rx="6"/>
  <text x="182" y="328" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">ZQCAL (7)</text>
  <text x="182" y="344" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">tZQCS -&gt; MPC</text>
  <rect x="55" y="370" width="255" height="46" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" rx="6"/>
  <text x="182" y="389" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">MR_POLL (6)</text>
  <text x="182" y="405" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">MR4 temp</text>
  <rect x="55" y="431" width="255" height="46" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" rx="6"/>
  <text x="182" y="450" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">MR_WRITE (9)</text>
  <text x="182" y="466" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">CSR MRW +verify</text>
  <rect x="55" y="492" width="255" height="46" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" rx="6"/>
  <text x="182" y="511" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">POWER_MGMT (10)</text>
  <text x="182" y="527" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">PD / SR</text>
  <line x1="330" y1="330" x2="558" y2="330" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="437" y1="337" x2="451" y2="323" stroke="#000000" stroke-width="1.0"/>
  <text x="340" y="322" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">single-bit flags (shared cmd interface):</text>
  <text x="340" y="350" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ref_urgent, ref_due, rfm_req, zq_due, mrr, mrw + me_cmd</text>
  <rect x="560" y="118" width="320" height="52" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="720" y="140" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">DEMAND  cas / act / pre -&gt; L3</text>
  <text x="720" y="157" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">per-bank class winners</text>
  <line x1="720" y1="170" x2="720" y2="206" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="730" y="192" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">demand</text>
  <rect x="560" y="206" width="320" height="214" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="720.0" y="228" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">SCHEDULER  (arb + packer)</text>
  <text x="720" y="268" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">ranks flags + demand together:</text>
  <text x="720" y="296" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">ref_urgent &gt; ref_due &gt; rfm &gt; zq</text>
  <text x="720" y="320" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">vs  cas / act / pre  (demand)</text>
  <text x="720" y="356" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">flags = soft priority</text>
  <text x="720" y="386" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">(no ME-internal priority-select)</text>
  <path d="M560 400 C500 400 420 440 332 440" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="360" y="456" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">sched_ack -&gt; ME</text>
  <path d="M182 126 V102 H1010 V266" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="600" y="96" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">INIT drives DFI till init_done (one-way) - the ONLY hard override</text>
  <rect x="935" y="266" width="150" height="80" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="1010.0" y="288" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">DFI_MUX</text>
  <text x="1010.0" y="303" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">sel = init_done</text>
  <line x1="880" y1="306" x2="933" y2="306" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="1010" y1="348" x2="1010" y2="390" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="1021" y="382" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">-&gt; DFI / PHY / DRAM</text>
  <text x="900" y="236" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ME writes scoreboard: gate_rfc/zq/mr, RAA, tREFI</text>
  <rect x="560" y="600" width="320" height="54" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="720.0" y="622" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">RD_CAP</text>
  <text x="720.0" y="637" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">read capture</text>
  <path d="M1010 348 V626 H882" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="1021" y="500" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">DRAM read</text>
  <rect x="380" y="590" width="170" height="50" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="465.0" y="612" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">MR_READ_ARB</text>
  <text x="465.0" y="627" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">grants 1: POLL | WRITE</text>
  <path d="M560 626 H465 V642" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="400" y="664" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">{mrr_data, valid, rank, requester} sideband (NOT resp FIFO)</text>
  <path d="M380 606 H345 V393 H312" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <path d="M380 620 H360 V454 H312" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="40" y="766" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">The ME is one block: its 7 FSMs share a single-bit flag interface into the scheduler, exactly like demand cmds. Scheduler ranks flags+demand together (flags = soft priority). INIT alone is a hard override (DFI mux). MR_POLL + MR_WRITE share the MR Read Arbiter; mrr_requester routes the sideband result.</text>
</svg>
