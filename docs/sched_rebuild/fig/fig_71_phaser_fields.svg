  <text x="975" y="668" font-size="10" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">p3</text>
  <text x="975" y="685" font-size="7.5" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">{cmd_sel[2],ui[1]}</text>
  <text x="50" y="724" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Each phase slot points to a record (cmd_sel) + which UI (ui_idx). A 2-UI cmd = two slots pointing to the same record, ui=0 then ui=1. Idle slot -&gt; DES.</text>
  <text x="40" y="774" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Phaser emits K&lt;=3 records (~49b: general cmd + general addr(row|col) + rw + rank/bg/bank/ap/bl + rob/sram) + per-phase placement {cmd_sel,ui}. CA fields -&gt; DFI_CMD_ENCODE; rob/sram -&gt; WL/RD at CAS commit; addr split UI0/UI1 by the encoder.</text>
