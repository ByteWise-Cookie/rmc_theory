  <text x="40" y="210" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">RST = issue-decode (reset-dominant).  SET = GC[12:0] &gt;= dqFree/caFree.</text>
  <text x="40" y="872" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">One DQ bus + one CA bus -&gt; single dqFree/caFree regs (x1, no address). Any CAS (either rank, 1/cycle) stamps dqFree = GC_ph + BL/2; can_cas_dq = GC &gt;= dqFree. LAST_CAS records {dir,rank,bg,ts} for the rank turnaround gate and the L3 cross-rank tRTRS pick. dqFree is same-dir occupancy only; flip + rank-hop + MRR/ZQ = parked handler.</text>
