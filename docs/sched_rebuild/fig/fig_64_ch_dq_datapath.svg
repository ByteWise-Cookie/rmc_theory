  <text x="40" y="150" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">x1 =&gt; NO address, NO write-demux - single reg, WE = any CAS (either rank).</text>
  <text x="40" y="168" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">dqFree = pure same-dir occupancy (BL/2). Flip penalty (tWTR/tRTW) lives at RANK (fig_63); cross-rank tRTRS + MRR/ZQ sharing at L3 = the parked DQ handler.</text>
