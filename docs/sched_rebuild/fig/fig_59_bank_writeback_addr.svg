  <text x="40" y="640" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">One address {r,bg,bank} fans to BOTH the reg WE and the can_* RESET decode - block-now + write-timestamp in one issue. CMD type (not address) routes {tRC,tRCD,tRAS} to the 3 adders; GC_ph + const = new next_*; GE re-sets can_* at GC &gt;= next_*. Replicated per scope.</text>
