<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1280" height="840" fill="#ffffff"/>
  <text x="40" y="38" font-size="15" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">Write path - AW-decoupled, allocate-on-arrival</text>
  <text x="40" y="58" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Admit AW on ROB space (NOT SRAM). W allocates SRAM on arrival. inflow counter = packets left from CIF. Pop delayed past ALERT_n.</text>
  <text x="60" y="96" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">AXI (one port)</text>
  <rect x="60" y="110" width="150" height="44" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="210" y="102" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">AW</text>
  <text x="210" y="86" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">addr req</text>
  <rect x="60" y="300" width="150" height="44" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="210" y="292" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">W</text>
  <text x="210" y="276" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">data + aw_id</text>
  <text x="48" y="128" font-size="10" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000"></text>
  <line x1="210" y1="132" x2="262" y2="132" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <path d="M300 104.0 L338.0 132 L300 160.0 L262.0 132 Z" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="300" y="132" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">admit?</text>
  <text x="300" y="147" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">ROB free</text>
  <line x1="338" y1="132" x2="400" y2="132" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="400" y="96" width="300" height="150" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="700" y="88" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">WRITE_ROB</text>
  <text x="700" y="72" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">per-packet rows, grouped by aw_id</text>
  <text x="416" y="140" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">aw_id  addr  sram_ptr  status</text>
  <text x="416" y="164" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">inflow_cnt (pkts left from CIF)</text>
  <text x="416" y="188" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">outflow_cnt (pkts left to write)</text>
  <path d="M300 160 V210 H236 V154" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="244" y="226" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ROB full -&gt; back-pressure AW</text>
  <line x1="210" y1="322" x2="262" y2="322" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <path d="M300 293.0 L342.0 322 L300 351.0 L258.0 322 Z" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="300" y="322" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">alloc?</text>
  <text x="300" y="337" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">SRAM free</text>
  <line x1="342" y1="322" x2="400" y2="322" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="400" y="296" width="300" height="120" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="700" y="288" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">WD_SRAM</text>
  <text x="416" y="336" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">incremental-order, 512b/line</text>
  <text x="416" y="360" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">1 packet = 1 line</text>
  <text x="416" y="382" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">arrival order (OOO across reqs)</text>
  <path d="M300 351 V400 H250 V344" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="258" y="416" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">SRAM full -&gt; back-pressure W</text>
  <path d="M470 296 V250" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="410" y="274" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">write_ptr + aw_id -&gt; ROB; inflow_cnt--</text>
  <line x1="700" y1="150" x2="900" y2="150" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="712" y="142" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">wr_pack {addr+off, rd_ptr}</text>
  <rect x="900" y="120" width="260" height="62" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="1030.0" y="142" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">MC SCHEDULER</text>
  <text x="1030.0" y="157" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">issue write (fig_28/32)</text>
  <line x1="1030" y1="182" x2="1030" y2="250" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="1038" y="220" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">CAS-W -&gt; DFI</text>
  <line x1="700" y1="356" x2="900" y2="356" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="720" y="348" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">512b line @ sram_rd_ptr</text>
  <rect x="900" y="330" width="260" height="54" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="1030.0" y="352" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">WR_SPLIT + WL_LAUNCH</text>
  <text x="1030.0" y="367" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">512b -&gt; 2*gear beats (fig_06)</text>
  <line x1="1030" y1="384" x2="1030" y2="430" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="1041" y="422" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">-&gt; dfi_wrdata</text>
  <rect x="780" y="500" width="300" height="72" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="930.0" y="522" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">POP CTRL</text>
  <text x="930.0" y="537" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">delay pop past ALERT_n window</text>
  <path d="M1030 250 V486 H1080 V500" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="1040" y="478" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">MC write-complete</text>
  <path d="M1030 430 V492 H930 V500" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="838" y="488" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">wr_done (self-timed)</text>
  <line x1="700" y1="540" x2="778" y2="540" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="600" y="534" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ALERT_n (write-CRC)</text>
  <path d="M780 556 H540 V416" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="548" y="470" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">clear -&gt; POP line (free SRAM), outflow_cnt--</text>
  <text x="548" y="490" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">alert in window -&gt; RETRY from SRAM (data held)</text>
  <line x1="1080" y1="556" x2="1180" y2="556" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="1180" y="550" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">COMPLETION</text>
  <text x="1090" y="590" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">wr_done | wr_error {rob_index, pkt}</text>
  <text x="40" y="792" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">AW admitted on ROB space (back-pressures AW); W allocates a WD_SRAM line on arrival (tag aw_id, inflow_cnt--), back-pressures W on SRAM full.</text>
  <text x="40" y="808" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ROB issues wr_pack when data present; MC writes; POP CTRL frees the line only after the ALERT_n window (write-CRC error retries from SRAM). Request-level error -&gt; CIF re-issues (stage 14).</text>
</svg>
