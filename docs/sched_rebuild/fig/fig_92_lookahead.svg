  <rect x="1250" y="286" width="150" height="28" fill="#e3f2f1" stroke="#000000" stroke-width="1.3" rx="4"/>
  <text x="1258" y="304" font-size="8.5" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000"></text>
  <text x="1258" y="304" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">-&gt; BANK_DEC</text>
  <text x="40" y="512" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Depth 4 = reorder window, NOT latency. New entry -&gt; lowest-free slot; all slots probed vs bank_rdy in parallel; bank_cmp holds per-bank order; prio_enc picks lowest eligible. BYPASS forwards input-&gt;out when window empty (0-cyc); else 1-cyc.</text>
