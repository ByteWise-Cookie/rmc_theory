  <text x="200" y="496" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">MAX = 1 cmd/bundle.  A 2-cyc (CAS/ACT) STRADDLES 2 bundles; PRE = 1 bundle.</text>
  <text x="40" y="600" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Per single rank: never 2 CAS (one DQ burst), never 2 ACT (tRRD_S=8 &gt; the 4-CK window - a second ACT needs a SECOND rank, [A A A A] cross-rank). PRE is the only x2 (tPPD=2). 1:4 is the only gear that fits two objects (CAS+ACT); 1:2 fits one; 1:1 streams one phase/bundle.</text>
