  <text x="500" y="384" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">MAX = ONE 2-cyc object (CAS or ACT); or 1 PRE.  No CAS+ACT (needs 4 slots).</text>
  <text x="40" y="452" font-size="13" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">gear 1:1  -  1 slot</text>
  <rect x="60" y="468" width="46" height="46" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="83.0" y="497.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">C</text>
