<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="38" font-size="15" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">Phaser split - command tokens vs CA-beat encoder</text>
  <text x="40" y="58" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Commit path = 1 token per command (no duplicate). 2-cyc -&gt; 2 beats expands ONLY in the output encoder. No dedup logic.</text>
  <rect x="50" y="92" width="200" height="54" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="150.0" y="114" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">ARB WINNERS</text>
  <text x="150.0" y="129" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">cas/act/pre + maint</text>
  <line x1="252" y1="119" x2="296" y2="119" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="298" y="88" width="200" height="62" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="398.0" y="110" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">PHASE_PACKER</text>
  <text x="398.0" y="125" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">place -&gt; tokens</text>
  <rect x="860" y="92" width="160" height="48" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="940.0" y="114" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">gear cfg reg</text>
  <text x="940.0" y="129" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">preset 1/2/4</text>
  <line x1="940" y1="140" x2="940" y2="342" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="948" y="250" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">gear (slot mask + placement)</text>
  <line x1="398" y1="150" x2="398" y2="186" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="298" y="186" width="300" height="128" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="598" y="178" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">TOKEN_BUNDLE</text>
  <text x="314" y="212" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">cmd  bank  addr  ph  len</text>
  <text x="314" y="236" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">CAS   b12   c..   0   2</text>
  <text x="314" y="258" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">ACT   b07   r..   2   2</text>
  <text x="314" y="280" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">PRE   b19   -    -   1</text>
  <text x="314" y="302" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">one entry per command  (no dup)</text>
  <path d="M298 250 H190 V354" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <path d="M598 250 H700 V342" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="150" y="348" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">COMMIT  -  1 per token</text>
  <line x1="190" y1="356" x2="190" y2="384" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="120" y1="388" x2="500" y2="388" stroke="#000000" stroke-width="1.0"/>
  <rect x="60" y="412" width="150" height="52" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="210" y="404" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">FSM_TABLE</text>
  <rect x="232" y="412" width="178" height="52" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="410" y="404" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">SCOREBOARD</text>
  <text x="410" y="388" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">next_* / dqFree</text>
  <rect x="432" y="412" width="120" height="52" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="552" y="404" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">RAA_CTR</text>
  <line x1="135" y1="388" x2="135" y2="410" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <line x1="321" y1="388" x2="321" y2="410" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <line x1="492" y1="388" x2="492" y2="410" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="60" y="486" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">one writeback per command - iterate tokens, no skip, no dedup</text>
  <text x="60" y="504" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">(gear not needed here; GC += gear is the separate timebase)</text>
  <rect x="700" y="342" width="320" height="66" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="860.0" y="364" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">CA_BEAT_ENCODER</text>
  <text x="860.0" y="379" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">token -&gt; 1 | 2 dfi beats</text>
  <path d="M700 372 C660 372 660 408 700 400" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="590" y="392" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">tail_pending</text>
  <text x="590" y="408" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">(1:1 straddle)</text>
  <line x1="860" y1="408" x2="860" y2="470" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="700" y="470" width="76" height="50" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="738" y="488" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">ph0</text>
  <text x="738" y="508" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">cs0 a1</text>
  <rect x="780" y="470" width="76" height="50" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="818" y="488" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">ph1</text>
  <text x="818" y="508" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">cs1 a2</text>
  <rect x="860" y="470" width="76" height="50" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.4"/>
  <text x="898" y="488" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">ph2</text>
  <text x="898" y="508" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">NOP</text>
  <rect x="940" y="470" width="76" height="50" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.4"/>
  <text x="978" y="488" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">ph3</text>
  <text x="978" y="508" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">NOP</text>
  <text x="1030" y="496" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">2-cyc -&gt; 2 beats:</text>
  <text x="1030" y="512" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">dup ISOLATED here</text>
  <line x1="860" y1="522" x2="860" y2="558" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="872" y="552" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">-&gt; DFI CA (dfi_cs / dfi_address) -&gt; PHY</text>
  <text x="40" y="712" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Two packer outputs: a token list (1 entry/command) drives commit + feedback with no duplicate;</text>
  <text x="40" y="730" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">the CA-beat encoder expands each token to 1-2 dfi phases (2-cyc = 2 beats) - the only place duplication exists. tail_pending holds beat2 into the next bundle at 1:1.</text>
</svg>
