  <text x="556" y="158" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#2a8f86">cycle_valid</text>
  <path d="M645.0 135.0 L675 135.0 A40.0 40.0 0 0 1 675 215.0 L645.0 215.0 Z" fill="none" stroke="#000000" stroke-width="1.0"/>
  <text x="669" y="179" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">&amp;</text>
  <line x1="705" y1="175" x2="770" y2="175" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="770" y="150" width="150" height="52" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="920" y="142" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">run_valid FF</text>
  <text x="920" y="126" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">load=1 @burst_start</text>
  <text x="700" y="130" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#7a4fb0">burst_start</text>
