  <text x="560" y="372" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#7a4fb0">run_valid</text>
  <text x="560" y="430" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#7a4fb0">cnt==0</text>
  <line x1="600" y1="428" x2="648" y2="418" stroke="#7a4fb0" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="705" y1="400" x2="900" y2="400" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="712" y="393" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#2a8f86">read_done</text>
  <rect x="900" y="387" width="150" height="26" fill="#e3f2f1" stroke="#000000" stroke-width="1.3" rx="4"/>
  <text x="908" y="404" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">read_done</text>
  <rect x="40" y="470" width="1100" height="74" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="56" y="492" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#2a8f86">cycle_valid = AND of ACTIVE-phase valids (gear masks inactive lanes to 1): 1:1=vp0 ; 1:2=vp0&amp;vp1 ; 1:4=vp0&amp;..&amp;vp3.</text>
  <text x="56" y="512" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#7a4fb0">run_valid &lt;= run_valid &amp; cycle_valid ; reset to 1 at burst_start. A bubble (any active-cycle valid low) drops run_valid.</text>
  <text x="56" y="532" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">read_done = run_valid &amp; (cnt==0). Bubble -&gt; run_valid=0 -&gt; read_done blocked (flag as read error). Contiguous -&gt; done.</text>
</svg>
