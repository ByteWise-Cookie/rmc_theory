  <text x="40" y="640" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Same-line ordering is a CIF request-wise stall (hold the AXI read until the write retires), NOT an MC packet-wise check - post-hash the MC has no line view. Overlaps are rare, so the coarse hold costs ~nothing.</text>
