  <text x="40" y="150" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">RST = issue-decode (reset-dominant).  SET = GC[12:0] &gt;= next_bg.</text>
  <text x="40" y="168" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">can_act_bgs blocks the whole BG's ACTs; can_cas_bgs blocks the BG's CAS.</text>
  <text x="40" y="1168" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Same skeleton as bank (fig_61), 2 fields: next_act_bg &lt;- ACT (fixed tRRD_L), next_cas_bg &lt;- RD/WR (2:1 tCCD_L/tCCD_L_WR). x16 cells, {rank,bg} write-route. If ACT+CAS hit the SAME BG same cycle they write DIFFERENT fields -&gt; no conflict. No vld - BG is spacing-only. Direction-match on next_cas_bg is by the const the last CAS wrote.</text>
