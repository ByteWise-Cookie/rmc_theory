  <text x="40" y="210" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Only 2 fields. next_act_bg written by ACT (fixed tRRD_L); next_cas_bg by RD/WR (2:1).</text>
  <text x="40" y="228" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">No vld/state gate - BG spacing is timing-only (unlike can_cas at bank).</text>
