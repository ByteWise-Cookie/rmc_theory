  <text x="40" y="500" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ready[i]=ei_vld &amp; bank_rdy_vec[ei_bank]. Binary p-enc picks HIGHEST set idx (oldest; demote pushes stalled heads up) -&gt; sel[1:0]; pop=|ready. One fixed 4:1 mux pops slot[sel] -&gt; freed stalled ei beats fresh e0. On pop: compact (newer shift up, e0&lt;-new). On e0-stall: demote e0-&gt;e1, e0&lt;-new. Order free (same-bank share bank_rdy + highest-idx); age-cap vs starve.</text>
