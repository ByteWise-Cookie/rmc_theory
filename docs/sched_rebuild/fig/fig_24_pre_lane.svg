<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1440" height="620" fill="#ffffff"/>
  <text x="1430" y="30" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">PRE lane  -  mask + find-first-two, one-hot end to end</text>
  <text x="30" y="46" font-size="15" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">PRE lane   (one-hot, no encoder / decoder / shift reg)</text>
  <text x="30" y="66" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">banks drive one-hot pre_rdy; pick the 2 lowest set bits; the grant one-hot goes straight to the cell.  Max 2 PRE / bundle (tPPD=2).</text>
  <rect x="250" y="205" width="175" height="118" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="337.5" y="264.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">AND_MASK</text>
  <text x="337.5" y="279.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">elig = pre_rdy &amp; ~inflight</text>
  <rect x="495" y="205" width="210" height="118" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="600.0" y="264.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">FIND_FIRST_2</text>
  <text x="600.0" y="279.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">p0=e&amp;-e ; m1=e&amp;~p0 ; p1=m1&amp;-m1</text>
  <rect x="775" y="205" width="175" height="118" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="862.5" y="264.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">REVALIDATE</text>
  <text x="862.5" y="279.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">&amp; pre_rdy (live)</text>
  <rect x="1180" y="185" width="180" height="175" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="1360" y="177" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">phase_packer</text>
  <text x="1270" y="250" font-size="13" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">place</text>
  <text x="1270" y="272" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">@ph0 , @ph2</text>
  <text x="1270" y="300" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">tPPD=2</text>
  <text x="1270" y="318" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">2 diff banks</text>
  <rect x="250" y="430" width="175" height="58" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="337.5" y="465.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">inflight  x32</text>
  <text x="337" y="502" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">the only flop in the lane</text>
  <line x1="60" y1="264" x2="248" y2="264" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="60" y="256" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">pre_rdy</text>
  <line x1="148.0" y1="271" x2="162.0" y2="257" stroke="#000000" stroke-width="1.0"/>
  <text x="165.0" y="280" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">x32</text>
  <text x="70" y="300" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">one-hot / bank  (from cells)</text>
  <line x1="427" y1="264" x2="493" y2="264" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="707" y1="264" x2="773" y2="264" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="600" y="340" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">x &amp; -x  =  isolate lowest set bit (blsi = priority find-first)</text>
  <line x1="952" y1="232" x2="1178" y2="232" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="958" y="224" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">preA (one-hot)</text>
  <line x1="952" y1="292" x2="1178" y2="292" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="958" y="284" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">preB (one-hot)</text>
  <text x="958" y="210" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#2e7d32" font-weight="bold">VALID = |elig   (free-running)</text>
  <line x1="1178" y1="340" x2="952" y2="340" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="958" y="356" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#c0392b" font-weight="bold">READY  (phaser: slot free)</text>
  <line x1="337" y1="430" x2="337" y2="325" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="347" y="400" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">~inflight</text>
  <path d="M1180 348 L1180 552 L612 552 L612 488" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="600" y="574" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">granted (preA|preB on transfer)  -&gt;  set inflight   (clear on cell pop)</text>
  <text x="63" y="460" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">pop clears</text>
  <line x1="150" y1="459" x2="248" y2="459" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="30" y="602" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">grant one-hot = the pick.  no encode / decode.  find-first-two is combinational -&gt; 2 PRE in one clk, no shift, no load penalty.</text>
  <text x="30" y="618" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">PRE lane: elig = pre_rdy &amp; ~inflight ; p0=e&amp;-e, p1=(e&amp;~p0)&amp;-(..) ; revalidate live ; phaser pulls &lt;=2/bundle over a backpressured valid/ready - PRE waits via held VALID, never by gating VALID on READY.</text>
</svg>
