  <text x="40" y="786" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">One per-bank cell = a flop-array slice (open_row + state, parallel-read = single-entry CAM) + row_comparator for is_hit + elig_gen gating need_* by can_* from BANK_TREG. Tier-1 picks cas/act/pre; grant pops on CAS.</text>
