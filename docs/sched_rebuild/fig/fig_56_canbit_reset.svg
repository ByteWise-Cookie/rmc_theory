  <text x="100.0" y="217.5" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">RD</text>
  <rect x="150" y="190" width="320" height="47" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
