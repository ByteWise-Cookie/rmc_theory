  <text x="480" y="165" font-size="10" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">  (whole BG)</text>
  <rect x="720" y="126" width="290" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="730" y="148" font-size="10" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">can_act_bgd (tRRD_S)</text>
  <text x="730" y="165" font-size="10" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">faw -&gt; can_act_rank</text>
  <rect x="1010" y="126" width="230" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
