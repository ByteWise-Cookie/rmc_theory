  <rect width="1280" height="560" fill="#ffffff"/>
  <text x="40" y="38" font-size="15" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">can_* RESET on issue - which SR flops clear (mirror of fig_50)</text>
  <text x="40" y="58" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">On issue, each stamped next_* RESETS its can_* to 0 (block now); the GE comparator re-SETS it when the deadline passes. Reset hits the scope gate.</text>
  <rect x="50" y="92" width="100" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
