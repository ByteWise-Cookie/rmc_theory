  <rect x="720" y="92" width="290" height="34" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="865.0" y="114" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000" font-weight="bold">RANK</text>
  <rect x="1010" y="92" width="230" height="34" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="1125.0" y="114" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000" font-weight="bold">GLOBAL / DQ</text>
  <rect x="50" y="126" width="100" height="64" fill="#efe6fb" stroke="#000000" stroke-width="1.4"/>
  <text x="100.0" y="162.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">ACT</text>
  <rect x="150" y="126" width="320" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="160" y="148" font-size="10" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">can_act, can_cas, can_pre</text>
