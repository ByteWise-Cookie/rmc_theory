  <text x="1044.0" y="615" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">3</text>
  <rect x="1068" y="590" width="48" height="40" fill="#f4f4f4" stroke="#000000" stroke-width="1.0"/>
  <text x="1092.0" y="615" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">2</text>
  <rect x="1116" y="590" width="48" height="40" fill="#f4f4f4" stroke="#000000" stroke-width="1.0"/>
  <text x="1140.0" y="615" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">1</text>
  <rect x="1164" y="590" width="48" height="40" fill="#f4f4f4" stroke="#000000" stroke-width="1.0"/>
  <text x="1188.0" y="615" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">0</text>
  <text x="444" y="584" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#2a8f86">HI=16  &lt;--- compare GC[16:7] (W=10) ---&gt;  LO=7</text>
  <text x="948.0" y="652" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">GC[6:0] dropped in compare</text>
  <text x="948.0" y="666" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">= 128 CK resolution</text>
  <text x="117.6" y="652" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">not needed for ref window</text>
  <rect x="60" y="730" width="200" height="56" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="260" y="722" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">ref_ts (24b)</text>
  <text x="260" y="706" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">deadline reg</text>
  <path d="M430 678.0 L485.0 700 L430 722.0 L375.0 700 Z" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="430" y="705" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">&gt;=</text>
  <text x="430" y="668" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#2a8f86">GC[16:7] &gt;= ref_ts[16:7]</text>
  <line x1="260" y1="640" x2="378" y2="700" stroke="#2a8f86" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="300" y="665" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#2a8f86">GC[16:7]</text>
  <line x1="260" y1="758" x2="382" y2="715" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="300" y="752" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">ref_ts[16:7]</text>
  <line x1="490" y1="700" x2="620" y2="700" stroke="#2a8f86" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="540" y="690" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#2a8f86">hit</text>
  <rect x="430" y="780" width="260" height="60" fill="#efe6fb" stroke="#000000" stroke-width="1.4"/>
  <text x="560" y="804" font-size="10" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">on hit: ref_ts += tREFI</text>
  <text x="560" y="824" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">FULL 24b add (carries low bits) -&gt; no drift</text>
  <path d="M560 780 V748 " fill="none" stroke="#777777" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <path d="M620 780 H720 V760 H265 V786" fill="none" stroke="#777777" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <circle cx="760" cy="300" r="34" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="760" y="300" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">debt</text>
  <text x="760" y="314" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">3b sat7</text>
  <line x1="360" y1="260" x2="726" y2="290" stroke="#2a8f86" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="620" y1="700" x2="740" y2="330" stroke="#2a8f86" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="700" y="260" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#2a8f86">tick/hit -&gt; debt++</text>
  <rect x="870" y="278" width="120" height="44" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="930.0" y="300" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">&amp;debt</text>
  <text x="930.0" y="315" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">==7</text>
  <line x1="794" y1="300" x2="868" y2="300" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="990" y1="300" x2="1060" y2="300" stroke="#b0602a" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="1066" y="296" font-size="10" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#b0602a">ref_pending (force)</text>
  <text x="760" y="360" font-size="8" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">debt=3b -&gt; force@7 keeps it &lt; 8-cap (JEDEC postpone)</text>
  <rect x="60" y="880" width="1240" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="80" y="904" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000" font-weight="bold">WHY B WORKS</text>
  <text x="80" y="926" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">1. ADD is exact (ref_ts += full 9360) -&gt; the deadline never drifts, no matter how coarse the compare.</text>
  <text x="80" y="944" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">2. COMPARE is truncated (drop low 7) -&gt; hit fires &lt;=128 CK EARLY of the exact deadline, ONCE (remainder varies per interval, 9360 mod 128 = 16 -&gt; no pile-up).</text>
  <text x="80" y="962" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">3. Reuses the 24b GC (no 2nd counter) + a ref_ts reg + a 10b compare. A vs B = wash in gates; B avoids a free-running counter, A avoids bit-math.</text>
</svg>
