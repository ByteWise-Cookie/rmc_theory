<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 1360 1000" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1360" height="1000" fill="#ffffff"/>
  <text x="40" y="32" font-size="15" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">Refresh interval: down-counter  vs  GC-slice compare  (why both work)</text>
  <rect x="940" y="60" width="380" height="180" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="1130" y="84" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">PARAMS (DDR5-4800)</text>
  <text x="952" y="108" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">tREFI   = 9360 CK   (3.9us / tCK 0.4167)</text>
  <text x="952" y="126" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">9360b   = 10_0100_1001_0000  (bits 13,10,7,4)</text>
  <text x="952" y="144" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">LO = clog2(tREFI)-6 = 7   (res 2^7=128 CK)</text>
  <text x="952" y="162" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">HI = clog2(tREFI)+2 = 16  (wrap 2^16=64k&gt;4x)</text>
  <text x="952" y="180" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">slice  = GC[16:7]  W=10b  (MSB..LSB)</text>
  <text x="952" y="198" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">debt = 3b (0..7)   force = &amp;debt (==7)</text>
  <text x="952" y="216" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">temp 2x: tREFI&gt;&gt;1 = 4680 ; 4x: 2340</text>
  <text x="40" y="90" font-size="13" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">A.  industry down-counter  (textbook, zero bit-math)</text>
  <rect x="60" y="120" width="200" height="60" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="260" y="112" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">refi_cnt (14b)</text>
  <text x="260" y="96" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">load 9360</text>
  <text x="70" y="200" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">2^14=16384 &gt;= 9360</text>
  <line x1="160" y1="180" x2="160" y2="230" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="168" y="210" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">-= gear / mc_clk</text>
  <path d="M160 240.0 L205.0 260 L160 280.0 L115.0 260 Z" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="160" y="265" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">==0 ?</text>
  <line x1="205" y1="260" x2="360" y2="260" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="230" y="250" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#2a8f86">tick</text>
  <path d="M160 280 V330 H60 V150 H60" fill="none" stroke="#777777" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="70" y="325" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">reload 9360</text>
  <text x="60" y="380" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">exact by construction. no compare, no drift. costs a 14b free counter.</text>
  <text x="40" y="450" font-size="13" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">B.  GC-slice compare  (reuse the 24b GC, add-exact / compare-coarse)</text>
  <rect x="60" y="490" width="200" height="56" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="260" y="482" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">global_counter_24b</text>
  <text x="260" y="466" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">+= gear / mc_clk</text>
  <text x="60" y="578" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">GC bit ruler  (bit 23 = MSB ... bit 0 = LSB)</text>
