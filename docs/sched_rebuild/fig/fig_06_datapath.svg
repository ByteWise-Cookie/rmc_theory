<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1180" height="700" fill="#ffffff"/>
  <line x1="720" y1="60" x2="720" y2="566" stroke="#777777" stroke-width="1.0" stroke-dasharray="5 4"/>
  <text x="400" y="50" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">SRAM side  -  512b wide, ratio-agnostic</text>
  <text x="980" y="50" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">DFI side  -  2*gear beats / mc_clk</text>
  <text x="300" y="118" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">from packer @ CAS-commit</text>
  <text x="300" y="136" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">{op, tag, sram_addr}</text>
  <path d="M430 114 L520 114 L520 86 L598 86" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="548" y="78" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">if RD</text>
  <path d="M430 140 L520 140 L520 406 L598 406" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="548" y="398" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">if WR</text>
  <rect x="120" y="150" width="160" height="66" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="200" y="178" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">RD_SRAM</text>
  <text x="200" y="196" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">512b / line</text>
  <rect x="600" y="66" width="46" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="646" y="66" width="46" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="692" y="66" width="46" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="738" y="66" width="46" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="784" y="66" width="46" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="600" y="56" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">RL_line   depth = CL</text>
  <text x="830" y="100" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">{rob_index, dbuf_addr}</text>
  <line x1="720" y1="106" x2="720" y2="148" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="732" y="130" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">fire @ slot 0</text>
  <rect x="600" y="148" width="240" height="84" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="720.0" y="190.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">read_accumulator</text>
  <text x="720.0" y="205.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">deserialize -&gt; gather 64B</text>
  <line x1="598" y1="183" x2="284" y2="183" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="433" y1="190" x2="447" y2="176" stroke="#000000" stroke-width="1.0"/>
  <text x="450" y="199" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">512b</text>
  <text x="440" y="172" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">1 x 512b write @ dbuf_addr</text>
  <line x1="1090" y1="183" x2="842" y2="183" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="953" y1="190" x2="967" y2="176" stroke="#000000" stroke-width="1.0"/>
  <text x="970" y="199" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">2*gear</text>
  <text x="966" y="172" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">dfi_rddata</text>
  <text x="720" y="258" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">last beat committed -&gt; rd_done</text>
  <rect x="120" y="470" width="160" height="66" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="200" y="498" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">WD_SRAM</text>
  <text x="200" y="516" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">512b / line</text>
  <rect x="600" y="386" width="46" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="646" y="386" width="46" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="692" y="386" width="46" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="738" y="386" width="46" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="784" y="386" width="46" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="600" y="376" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">WL_line   depth = CWL</text>
  <text x="830" y="420" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">{wd_slot}</text>
  <line x1="720" y1="426" x2="720" y2="468" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="732" y="450" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">fire @ slot 0</text>
  <rect x="600" y="468" width="240" height="84" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="720.0" y="510.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">write_burst_splitter</text>
  <text x="720.0" y="525.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">512b -&gt; serialize</text>
  <line x1="284" y1="503" x2="598" y2="503" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="433" y1="510" x2="447" y2="496" stroke="#000000" stroke-width="1.0"/>
  <text x="450" y="519" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">512b</text>
  <text x="440" y="492" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">1 x 512b read @ wd_slot</text>
  <line x1="842" y1="503" x2="1090" y2="503" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="959" y1="510" x2="973" y2="496" stroke="#000000" stroke-width="1.0"/>
  <text x="976" y="519" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">2*gear</text>
  <text x="966" y="492" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">dfi_wrdata</text>
  <text x="720" y="578" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">last beat driven -&gt; wr_done  (self-timed, no ack)</text>
  <text x="1090" y="640" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">rd_done | wr_done  -&gt;  completion  -&gt;  CIF</text>
  <text x="40" y="686" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">One 512b SRAM access per packet. The accumulator and splitter are the ONLY blocks that know the gear ratio - the RAMs stay ratio-agnostic.</text>
</svg>
