  <text x="40" y="980" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">WRITE: WR commit arms WL_LINE (tphy_wrlat) -&gt; dfi_wrdata_en, then dfi_wrdata_pN after tphy_wrdata (8 beats from WD_SRAM via WR_SPLIT); dfi_odt = RTT_WR window; PHY drives DQ at CWL.  READ: RD commit arms RL_LINE (tphy_rdlat) -&gt; dfi_rddata_en; PHY returns dfi_rddata_wN + valid at RL=CL; RD_ACCUM gathers on valid -&gt; 512b -&gt; RD_SRAM. tphy_* = PHY params; latencies deterministic -&gt; plain shift lines, no CAM.</text>
