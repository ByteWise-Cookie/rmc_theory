  <text x="40" y="752" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">One cell of 64 (cell[{r,b}], N_RANKS=2). row_valid gates admission: high only while the row is OPEN and no PRE is in flight. Intent drops it early; FSM commits at out_cmd_fifo.</text>
