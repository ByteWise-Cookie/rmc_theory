  <text x="40" y="210" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">RST = issue-decode (reset-dominant).  SET = GC[12:0] &gt;= ts (&gt;=, never ==).</text>
  <text x="40" y="1228" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Rank = 2 writeback adders + faw ring, feeding 5 gates over x2 rank entries. adder0 -&gt; next_act_dbg (tRRD_S, ACT). adder1 -&gt; next_wr/next_rd/next_pre (demux by cmd: RD-&gt;wr, WR-&gt;rd, PRE-&gt;pre). FAW_RING[4] latches GC_ph on ACT (no adder); read-side +tFAW on the oldest -&gt; can_act_rank. 2-PRE both target next_pre -&gt; max-select later phase, one write.</text>
