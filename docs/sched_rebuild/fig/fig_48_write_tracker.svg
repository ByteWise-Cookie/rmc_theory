<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="800" viewBox="0 0 1260 800" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1260" height="800" fill="#ffffff"/>
  <text x="40" y="38" font-size="15" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">Write tracking - one counter, aw_len stored ONCE</text>
  <text x="40" y="58" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Merge inflow (pkt_offset.count) + outflow (return_tracker.count) -&gt; one n_outstanding. fill_done (wlast) gates retire, replaces the 2nd aw_len.</text>
  <rect x="50" y="95" width="150" height="44" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="200" y="87" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">axi_write_request</text>
  <line x1="200" y1="117" x2="256" y2="117" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="256" y="88" width="340" height="74" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="426" y="84" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">wr_meta_data</text>
  <text x="272" y="116" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">aw_id . aw_size . aw_len . w_phy_adr</text>
  <text x="272" y="138" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">aw_len stored ONCE (feeds pkt gen)</text>
  <line x1="330" y1="162" x2="330" y2="212" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="256" y="212" width="150" height="60" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="406" y="204" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">tcam {aw_id}</text>
  <text x="406" y="188" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">-&gt; idx</text>
  <line x1="540" y1="162" x2="540" y2="212" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="548" y="190" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">aw_len, w_phy_adr</text>
  <rect x="450" y="212" width="360" height="84" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="630" y="208" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">pkt_offset  (ADDRESS gen only)</text>
  <text x="466" y="240" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">offset = w_phy_adr + i*64B</text>
  <text x="466" y="260" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">i = 0..N-1   (N from meta.aw_len)</text>
  <text x="466" y="280" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">count = transient gen index, NOT a retire total</text>
  <line x1="630" y1="296" x2="630" y2="340" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <path d="M406 242 H430 V370 H448" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="412" y="360" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">idx, vld</text>
  <rect x="450" y="340" width="360" height="60" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="630" y="336" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">wr_packet_genator</text>
  <text x="466" y="374" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">emit N packets {idx, wr_ptr, offset_addr}</text>
  <line x1="810" y1="370" x2="866" y2="370" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="866" y="340" width="200" height="60" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="1066" y="332" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">WD_SRAM -&gt; MC</text>
  <text x="1066" y="316" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">WR_ACCUM (fig_47)</text>
  <rect x="300" y="470" width="470" height="170" fill="#efe6fb" stroke="#000000" stroke-width="1.4"/>
  <text x="535" y="494" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">WRITE TRACKER  (per aw_id / idx)</text>
  <text x="330" y="522" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">vld</text>
  <text x="400" y="522" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">fill_done</text>
  <text x="520" y="522" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">n_outstanding</text>
  <rect x="322" y="530" width="60" height="26" fill="none" stroke="#000000" stroke-width="1.4"/>
  <rect x="400" y="530" width="90" height="26" fill="none" stroke="#000000" stroke-width="1.4"/>
  <rect x="520" y="530" width="120" height="26" fill="none" stroke="#000000" stroke-width="1.4"/>
  <text x="352" y="548" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">1</text>
  <text x="445" y="548" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">0</text>
  <text x="580" y="548" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">2</text>
  <text x="650" y="548" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">(mid-fill)</text>
  <text x="316" y="584" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">++ n_outstanding  &lt;- packet in SRAM (inflow)</text>
  <text x="316" y="602" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">-- n_outstanding  &lt;- wr_done (write_rob, outflow)</text>
  <text x="316" y="620" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">fill_done &lt;- AXI wlast</text>
  <path d="M960 400 V440 H760 V472" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="770" y="458" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">++ inflow (pkt landed)</text>
  <rect x="870" y="500" width="200" height="60" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="1070" y="492" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">write_rob</text>
  <text x="1070" y="476" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">per-pkt {vld, wr_done}</text>
  <line x1="868" y1="530" x2="772" y2="530" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="786" y="522" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">-- wr_done</text>
  <path d="M120 139 V560 H298 V560" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="130" y="540" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">AXI wlast -&gt; fill_done</text>
  <line x1="535" y1="640" x2="535" y2="690" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="545" y="672" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">RETIRE = fill_done &amp; n_outstanding==0</text>
  <text x="545" y="690" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">-&gt; mc_resp ; free tcam / ROB entry</text>
  <text x="316" y="662" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#c0392b" font-weight="bold">n==0 ALONE false-retires mid-fill -&gt; fill_done MANDATORY</text>
  <rect x="880" y="80" width="340" height="90" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.4"/>
  <text x="896" y="104" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">MERGED (was stored twice):</text>
  <text x="896" y="124" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">old pkt_offset.count  (inflow target)</text>
  <text x="896" y="140" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">+ old return_tracker.count (outflow target)</text>
  <text x="896" y="158" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">=&gt; one n_outstanding; aw_len no longer duplicated</text>
  <text x="40" y="770" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">aw_len lives once in wr_meta_data (pkt gen only). One WRITE TRACKER per aw_id holds {vld, fill_done, n_outstanding}: ++ on inflow, -- on wr_done, retire when fill_done &amp; n==0. pkt_offset does address gen only. No double aw_len; mid-fill early-retire fixed by fill_done.</text>
</svg>
