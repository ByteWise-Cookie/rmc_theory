<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="800" viewBox="0 0 1260 800" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1260" height="800" fill="#ffffff"/>
  <text x="40" y="38" font-size="15" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">Write tracking - one counter, aw_len stored ONCE</text>
  <text x="40" y="58" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Two up-counters per aw_id: gen_idx (nth packet -&gt; addr offset) + done_cnt (wr_done -&gt; retire at ==N). N=aw_len stored ONCE. No fill bit (up-count self-guards).</text>
  <rect x="50" y="95" width="150" height="44" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="200" y="87" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">axi_write_request</text>
  <line x1="200" y1="117" x2="256" y2="117" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="256" y="88" width="340" height="74" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="426" y="84" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">wr_meta_data</text>
  <text x="272" y="116" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">aw_id . aw_size . aw_len . w_phy_adr</text>
  <text x="272" y="138" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">aw_len stored ONCE (feeds pkt gen)</text>
  <line x1="330" y1="162" x2="330" y2="212" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="256" y="212" width="150" height="60" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="406" y="204" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">tcam {aw_id}</text>
  <text x="406" y="188" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">-&gt; idx</text>
  <line x1="540" y1="162" x2="540" y2="212" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="548" y="190" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">aw_len, w_phy_adr</text>
  <rect x="450" y="212" width="360" height="84" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="630" y="208" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">pkt_offset  (ADDRESS gen only)</text>
  <text x="466" y="240" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">offset = w_phy_adr + gen_idx*64B</text>
  <text x="466" y="260" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">gen_idx = the nth packet (from tracker)</text>
  <text x="466" y="280" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">walks 0..N-1; N from meta.aw_len</text>
  <line x1="630" y1="296" x2="630" y2="340" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <path d="M406 242 H430 V370 H448" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="412" y="360" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">idx, vld</text>
  <rect x="450" y="340" width="360" height="60" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="630" y="336" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">wr_packet_genator</text>
  <text x="466" y="374" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">emit N packets {idx, wr_ptr, offset_addr}</text>
  <line x1="810" y1="370" x2="866" y2="370" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="866" y="340" width="200" height="60" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="1066" y="332" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">WD_SRAM -&gt; MC</text>
  <text x="1066" y="316" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">WR_ACCUM (fig_47)</text>
  <rect x="300" y="470" width="480" height="172" fill="#efe6fb" stroke="#000000" stroke-width="1.4"/>
  <text x="540" y="494" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">WRITE TRACKER  (per aw_id / idx)</text>
  <text x="349.5" y="522" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">vld</text>
  <rect x="322" y="530" width="55" height="26" fill="none" stroke="#000000" stroke-width="1.4"/>
  <text x="417.5" y="522" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">N</text>
  <rect x="390" y="530" width="55" height="26" fill="none" stroke="#000000" stroke-width="1.4"/>
  <text x="507.5" y="522" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">gen_idx</text>
  <rect x="460" y="530" width="95" height="26" fill="none" stroke="#000000" stroke-width="1.4"/>
  <text x="625.5" y="522" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">done_cnt</text>
  <rect x="578" y="530" width="95" height="26" fill="none" stroke="#000000" stroke-width="1.4"/>
  <text x="349.5" y="548" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">1</text>
  <text x="417.5" y="548" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">5</text>
  <text x="507.5" y="548" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">3</text>
  <text x="625.5" y="548" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">2</text>
  <text x="688" y="548" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">(gen 3, done 2)</text>
  <text x="316" y="586" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">N        = packet count from aw_len  (stored ONCE, at alloc)</text>
  <text x="316" y="604" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">gen_idx  ++ per packet issued  -&gt; addr offset = base + gen_idx*64B</text>
  <text x="316" y="622" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">done_cnt ++ per wr_done        -&gt; RETIRE when done_cnt == N</text>
  <path d="M300 530 H250 V400" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="150" y="470" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">gen_idx -&gt; addr offset (nth packet)</text>
  <rect x="870" y="500" width="200" height="60" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="1070" y="492" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">write_rob</text>
  <text x="1070" y="476" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">per-pkt {vld, wr_done}</text>
  <line x1="868" y1="542" x2="782" y2="542" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="792" y="534" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">++ done_cnt (wr_done)</text>
  <line x1="540" y1="642" x2="540" y2="690" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="550" y="672" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">RETIRE = (done_cnt == N)</text>
  <text x="550" y="690" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">-&gt; mc_resp ; free tcam / ROB entry</text>
  <text x="316" y="662" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#1a7a3a" font-weight="bold">done_cnt counts UP to N -&gt; no mid-fill hazard (beats net==0, no fill bit)</text>
  <rect x="880" y="80" width="350" height="108" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.4"/>
  <text x="896" y="104" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">MERGED (was aw_len x2):</text>
  <text x="896" y="124" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">old pkt_offset.count (inflow) -&gt; gen_idx</text>
  <text x="896" y="140" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">old return_tracker.count (outflow) -&gt; done_cnt</text>
  <text x="896" y="156" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">both compare to N; N (=aw_len) stored ONCE</text>
  <text x="896" y="172" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">no fill_done: done_cnt UP to N is self-guarding</text>
  <text x="40" y="770" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">aw_len -&gt; N stored once (in the tracker row / meta). WRITE TRACKER per aw_id holds {vld, N, gen_idx, done_cnt}: gen_idx gives the nth-packet addr offset and stops gen at N; done_cnt counts wr_done and retires at ==N. Two up-counters vs one N - no double aw_len, and no fill bit needed (up-count is self-guarding).</text>
</svg>
