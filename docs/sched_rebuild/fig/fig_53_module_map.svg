  <text x="1412" y="752" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">-&gt; CIF (resp)</text>
  <text x="40" y="1030" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Build as parametric SystemVerilog: mc_pkg + interfaces (dfi/axi/arb/sb) glue the modules; ports come from figs 39-51. Ingress -&gt; arb (scoreboard folds legality into can_*) -&gt; phaser -&gt; DFI; maint injects flags; data path arms at CAS-commit. IP Integrator only at the SoC top - internals stay text SV (git + DDR-portable).</text>
