  <text x="40" y="150" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#7a4fb0">RST = issue-decode (reset-dominant, beats coincident set).</text>
  <text x="40" y="168" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#2a8f86">SET = GC[12:0] &gt;= time_stamp (&gt;=, never ==).</text>
  <text x="40" y="186" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">2 control units / rank (CAS+ACT slots) -&gt; 2 WE decodes, different banks.</text>
  <text x="40" y="1168" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">GC 24b +=gear -&gt; +phase_off -&gt; GC_ph; const_sel routes 6 consts to tc_act/cas/pre by op_code; 3 adders -&gt; {bg,bank} write-route (one-hot WE + field mask) into x32 {vld,ts} cells; each cell compares GC[12:0]&gt;=ts -&gt; SET, issue -&gt; RST (reset-dominant). can_cas also ANDs vld(OPEN). Refresh reuses the wide GC[23:0].</text>
