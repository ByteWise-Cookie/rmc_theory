<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="760" viewBox="0 0 1140 760" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1140" height="760" fill="#ffffff"/>
  <text x="430" y="58" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">cmd_issued  @ out_cmd_fifo commit</text>
  <line x1="430" y1="66" x2="430" y2="84" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="280" y="86" width="300" height="86" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="430.0" y="108" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">timing_reg_file   (T_*)</text>
  <text x="300" y="138" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">parametric:  ns floor + tCK  -&gt;  CK</text>
  <text x="300" y="158" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">T_RCD  T_RP  T_RAS  T_CCD  T_RTP ...</text>
  <line x1="430" y1="172" x2="430" y2="204" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="444" y="192" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">T_x</text>
  <circle cx="150" cy="230" r="44" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="150" y="230" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">GC</text>
  <text x="150" y="244" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">+gear</text>
  <text x="150" y="292" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">13-bit CK, wraps</text>
  <line x1="196" y1="230" x2="358" y2="230" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="360" y="204" width="180" height="52" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="450.0" y="230.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">adder</text>
  <text x="450.0" y="245.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">next_x = GC + T_x</text>
  <line x1="450" y1="256" x2="450" y2="312" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="464" y="288" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">written once @ issue</text>
  <text x="300" y="306" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">deadline table  (per bank)</text>
  <rect x="300" y="314" width="150" height="52" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="375.0" y="346.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">next_act[b]</text>
  <rect x="450" y="314" width="150" height="52" fill="#efe6fb" stroke="#000000" stroke-width="1.4"/>
  <text x="525.0" y="346.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">next_cas[b]</text>
  <rect x="600" y="314" width="150" height="52" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="675.0" y="346.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">next_pre[b]</text>
  <rect x="790" y="314" width="320" height="130" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="950.0" y="336" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">comparator   (x3 class  x32 bank)</text>
  <text x="950" y="362" font-size="15" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">can_x = (GC - next_x)[MSB] == 0</text>
  <text x="950" y="392" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">MSB = sign of the wrap-subtract</text>
  <text x="950" y="410" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">no full compare in the pick path</text>
  <line x1="750" y1="340" x2="788" y2="340" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="762" y1="347" x2="776" y2="333" stroke="#000000" stroke-width="1.0"/>
  <text x="779" y="356" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">next_*[b]</text>
  <path d="M150 274 L150 500 L950 500 L950 446" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="560" y="490" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">GC  (broadcast to every comparator)</text>
  <line x1="950" y1="446" x2="950" y2="548" stroke="#7a5cb8" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="964" y="528" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#7a5cb8">can_pre/act/cas</text>
  <text x="950" y="568" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#7a5cb8">-&gt;  elig_gen (fig_03)</text>
  <text x="300" y="612" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">cross-bank: a CAS issue ALSO writes tCCD_S/tRRD into OTHER banks' next_cas deadlines,</text>
  <text x="300" y="628" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">so can_* already carries cross-bank spacing  -  the arb tiers never reject a winner.</text>
  <rect x="300" y="660" width="58" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="329.0" y="686.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">t0</text>
  <rect x="358" y="660" width="58" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="387.0" y="686.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">t1</text>
  <rect x="416" y="660" width="58" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="445.0" y="686.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">t2</text>
  <rect x="474" y="660" width="58" height="40" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="503.0" y="686.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">t3</text>
  <text x="300" y="650" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">faw_ts[4]  (per rank)</text>
  <text x="548" y="684" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">can_act also needs  (GC - faw_ts[oldest]) &gt;= tFAW</text>
  <text x="548" y="700" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">tWTR / tRTW: rank-scoped, keyed by last_cas_dir/ts</text>
  <text x="40" y="748" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Legality is deadline-form: can_x is just the MSB of GC - next_x. Comparators write only the 1-bit gates; timestamps are written once, at issue.</text>
</svg>
