  <text x="40" y="812" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Same slice as fig_52 replicated across BANK/BGS/BGD/RANK/GLOBAL and driven by every issued cmd via the fig_50 writeback: UPD stamps next_* (GC_ph+const) with per-scope WE, GE sets the SR flop at the deadline, issue-decode resets it. The arb ANDs the scope can_* a candidate touches into can_act/cas/pre. Optimize (share adders/cmps) later.</text>
