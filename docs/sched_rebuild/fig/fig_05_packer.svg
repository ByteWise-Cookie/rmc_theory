<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1160" height="720" fill="#ffffff"/>
  <rect x="80" y="78" width="300" height="92" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="230.0" y="100" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">tier-3 ranked candidates</text>
  <text x="96" y="122" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">{cmd, bg, bank, rob_index, width}</text>
  <text x="96" y="144" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ranked: timing distance + hit-bias</text>
  <line x1="230" y1="170" x2="230" y2="212" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="80" y="212" width="300" height="188" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="230.0" y="234" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">phase_packer   (gear 1:N)</text>
  <text x="100" y="250" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">fill phase[0..N-1] greedily:</text>
  <text x="100" y="277" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">- CA slot: 2-cyc cmd = 2 phases</text>
  <text x="100" y="304" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">- &lt;= 1 CAS / 8 CK   (dqFree)</text>
  <text x="100" y="331" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">- &gt;= 2 live BG: alternate CAS BG</text>
  <text x="100" y="358" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">- losers spill -&gt; next mc_clk</text>
  <line x1="230" y1="400" x2="230" y2="470" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="223" y1="442" x2="237" y2="428" stroke="#000000" stroke-width="1.0"/>
  <text x="240" y="451" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">N phases</text>
  <text x="230" y="492" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">-&gt;  DFI cmd (dfi_address/cs per phase)</text>
  <path d="M380 300 L470 300 L470 560 L560 560" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="475" y="548" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">cmd_issued -&gt; update deadlines (fig_04)</text>
  <text x="560" y="96" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">phase bundle @ 1:4    (1 mc_clk = 4 CK = 4 phases)</text>
  <text x="608" y="122" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">phase 0</text>
  <text x="704" y="122" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">phase 1</text>
  <text x="800" y="122" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">phase 2</text>
  <text x="896" y="122" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">phase 3</text>
  <rect x="560" y="132" width="96" height="52" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="608.0" y="164.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">RD</text>
  <rect x="656" y="132" width="96" height="52" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="704.0" y="164.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">RD</text>
  <rect x="752" y="132" width="96" height="52" fill="#efe6fb" stroke="#000000" stroke-width="1.4"/>
  <text x="800.0" y="164.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">ACT</text>
  <rect x="848" y="132" width="96" height="52" fill="#efe6fb" stroke="#000000" stroke-width="1.4"/>
  <text x="896.0" y="164.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">ACT</text>
  <text x="548" y="162" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#000000">mc_clk T</text>
  <text x="656" y="204" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">BG0  (1 CAS)</text>
  <text x="848" y="204" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">BG3  (1 ACT)</text>
  <rect x="560" y="224" width="96" height="52" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="608.0" y="256.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">PRE</text>
  <rect x="656" y="224" width="96" height="52" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="704.0" y="256.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">.</text>
  <rect x="752" y="224" width="96" height="52" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="800.0" y="256.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">.</text>
  <rect x="848" y="224" width="96" height="52" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="896.0" y="256.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">.</text>
  <text x="548" y="254" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#000000">mc_clk T+1</text>
  <text x="700" y="296" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">no CAS until CK 8  (DQ still busy)</text>
  <rect x="560" y="316" width="96" height="52" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="608.0" y="348.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">RD</text>
  <rect x="656" y="316" width="96" height="52" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="704.0" y="348.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">RD</text>
  <rect x="752" y="316" width="96" height="52" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="800.0" y="348.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">.</text>
  <rect x="848" y="316" width="96" height="52" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="896.0" y="348.0" font-size="17" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">.</text>
  <text x="548" y="346" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#000000">mc_clk T+2</text>
  <text x="656" y="388" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">next CAS, different BG</text>
  <path d="M984 158 L1010 158 L1010 342 L984 342" fill="none" stroke="#000000" stroke-width="1.0"/>
  <text x="1022" y="254" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">8 CK</text>
  <text x="1022" y="272" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">tCCD_S</text>
  <text x="1022" y="288" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">DQ heartbeat</text>
  <text x="40" y="700" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">At 1:4 the packer fills 4 phases, but the DQ allows &lt;= 1 CAS per 8 CK - so a bundle is 1 CAS + 1 ACT + fill PRE, and the next CAS lands two mc_clks later in a different BG.</text>
</svg>
