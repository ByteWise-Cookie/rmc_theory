<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1200" height="1000" fill="#ffffff"/>
  <text x="40" y="38" font-size="15" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">Every command's ready-path to the scheduler</text>
  <text x="40" y="58" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">DEMAND (cas/act/pre) go through the per-bank arb tree; everything else is engine-sourced and override-injects at the phaser.</text>
  <text x="55" y="96" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">COMMAND</text>
  <text x="250" y="96" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">ready signal</text>
  <text x="420" y="96" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">source</text>
  <text x="600" y="96" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">scope</text>
  <text x="760" y="96" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">path to scheduler</text>
  <text x="1000" y="96" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">gate</text>
  <line x1="40" y1="106" x2="1160" y2="106" stroke="#aaaaaa" stroke-width="1.0"/>
  <text x="48" y="130" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777" font-weight="bold">DEMAND  -  packet-sourced, per-bank contention  -&gt;  arb tree</text>
  <line x1="40" y1="138" x2="1160" y2="138" stroke="#aaaaaa" stroke-width="1.0"/>
  <text x="55" y="158" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">RD / WR / MWR</text>
  <text x="250" y="158" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">cas_rdy</text>
  <text x="420" y="158" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">cas_path cell</text>
  <text x="600" y="158" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">bank</text>
  <text x="760" y="158" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">tree -&gt; cas lane -&gt; L3</text>
  <text x="1000" y="158" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">can_cas &amp; dqFree</text>
  <text x="55" y="190" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">ACT</text>
  <text x="250" y="190" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">act_rdy</text>
  <text x="420" y="190" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">act_path cell</text>
  <text x="600" y="190" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">bank</text>
  <text x="760" y="190" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">tree -&gt; act lane -&gt; L3</text>
  <text x="1000" y="190" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">can_act</text>
  <text x="55" y="222" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">PRE  (demand)</text>
  <text x="250" y="222" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">pre_rdy</text>
  <text x="420" y="222" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">act_path head</text>
  <text x="600" y="222" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">bank</text>
  <text x="760" y="222" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">tree -&gt; pre lane -&gt; L3</text>
  <text x="1000" y="222" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">can_pre (tRAS/tRTP/tWR)</text>
  <text x="48" y="258" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777" font-weight="bold">MAINTENANCE / CONFIG  -  engine-sourced, rank/device scope  -&gt;  override inject (NO tree)</text>
  <line x1="40" y1="266" x2="1160" y2="266" stroke="#aaaaaa" stroke-width="1.0"/>
  <text x="55" y="286" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">REFsb / REFab</text>
  <text x="250" y="286" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">ref_rdy</text>
  <text x="420" y="286" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">REFRESH eng (per rank)</text>
  <text x="600" y="286" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">8-bank / rank</text>
  <text x="760" y="286" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#c0392b">inject override</text>
  <text x="1000" y="286" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">gate_rfc; sets REF_pending</text>
  <text x="55" y="318" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">PREsb / PREab</text>
  <text x="250" y="318" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">(ref substep)</text>
  <text x="420" y="318" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">REFRESH eng</text>
  <text x="600" y="318" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">8-bank / rank</text>
  <text x="760" y="318" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">rides ref handshake (drain)</text>
  <text x="1000" y="318" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">-</text>
  <text x="55" y="350" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">RFM</text>
  <text x="250" y="350" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">rfm_rdy</text>
  <text x="420" y="350" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">RFM eng (per rank)</text>
  <text x="600" y="350" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">BG / rank</text>
  <text x="760" y="350" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#c0392b">inject override</text>
  <text x="1000" y="350" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">raa_count &gt;= thresh</text>
  <text x="55" y="382" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">ZQCAL</text>
  <text x="250" y="382" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">zq_rdy</text>
  <text x="420" y="382" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ZQ eng</text>
  <text x="600" y="382" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">rank / channel</text>
  <text x="760" y="382" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#c0392b">inject override (solo)</text>
  <text x="1000" y="382" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">tZQ ; caFree</text>
  <text x="55" y="414" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">MRW</text>
  <text x="250" y="414" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">mrw_rdy</text>
  <text x="420" y="414" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">MRW eng</text>
  <text x="600" y="414" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">device</text>
  <text x="760" y="414" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#c0392b">inject override (solo)</text>
  <text x="1000" y="414" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">caFree</text>
  <text x="55" y="446" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">MRR</text>
  <text x="250" y="446" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">mrr_rdy</text>
  <text x="420" y="446" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">MRR eng</text>
  <text x="600" y="446" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">device (DQ)</text>
  <text x="760" y="446" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#c0392b">inject override (solo)</text>
  <text x="1000" y="446" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">dqFree  (uses DQ!)</text>
  <text x="55" y="478" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">INIT</text>
  <text x="250" y="478" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">init_rdy</text>
  <text x="420" y="478" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">INIT FSM</text>
  <text x="600" y="478" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">device</text>
  <text x="760" y="478" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">drives DFI mux till init_done</text>
  <text x="1000" y="478" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">init_done handoff</text>
  <text x="55" y="510" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">MPC / SRE.SRX / PDE.PDX</text>
  <text x="250" y="510" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">state</text>
  <text x="420" y="510" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">power FSM</text>
  <text x="600" y="510" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">rank / device</text>
  <text x="760" y="510" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">DFI state / inject</text>
  <text x="1000" y="510" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">-</text>
  <line x1="40" y1="554" x2="1160" y2="554" stroke="#aaaaaa" stroke-width="1.0"/>
  <text x="48" y="568" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">the two domains merge at the phaser</text>
  <rect x="60" y="586" width="380" height="150" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="250.0" y="608" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">DEMAND</text>
  <text x="78" y="624" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">cas_rdy  act_rdy  pre_rdy</text>
  <line x1="250" y1="634" x2="250" y2="652" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="110" y="652" width="280" height="42" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="250.0" y="673.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">per-bank arb tree</text>
  <text x="250.0" y="688.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">CMD &gt; BGB &gt; BG &gt; RANK</text>
  <line x1="250" y1="694" x2="250" y2="712" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="160" y="728" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">best_cas/act/pre[r]  -&gt;  L3</text>
  <rect x="620" y="586" width="480" height="150" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="860.0" y="608" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">MAINTENANCE</text>
  <text x="638" y="622" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">init/ref/rfm/zq/mrw/mrr _rdy</text>
  <line x1="760" y1="632" x2="760" y2="652" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="640" y="652" width="440" height="42" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="860.0" y="673.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">PRIORITY_SELECT</text>
  <text x="860.0" y="688.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">init &gt; ref_urgent &gt; rfm &gt; ref_due &gt; zq &gt; mrw/mrr</text>
  <line x1="860" y1="694" x2="860" y2="712" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="790" y="728" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#c0392b">maint_cmd (OVERRIDE)</text>
  <rect x="360" y="752" width="420" height="54" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="570.0" y="779.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">PHASE PACKER</text>
  <text x="570.0" y="794.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">override &gt; demand : maint preempts, demand spills</text>
  <path d="M250 740 V744 H430 V752" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <path d="M860 740 V744 H710 V752" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="570" y1="806" x2="570" y2="832" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="582" y="826" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">-&gt;  DFI / PHY / DRAM</text>
  <text x="40" y="860" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Demand = fair selection through the per-bank tree. Maintenance bypasses the tree, priority-selects one winner, override-injects at the phaser.</text>
  <text x="40" y="878" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Same skeleton for all maint cmds; MRR still pays dqFree, refresh sets gate_rfc.</text>
</svg>
