  <text x="1014.5" y="440" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">enc-&gt;CA decode; arm iff CAS</text>
  <line x1="60" y1="502" x2="1117" y2="502" stroke="#efe6fb" stroke-width="3"/>
  <text x="60" y="520" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">only {enc, dir} + grant ride the tree (3 b) - operand fetched once at the packer by idx</text>
  <text x="40" y="640" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">One enc-tagged micro-op rides the arb tree: enc reinterprets a 27-b union operand (ACT row and CAS {col,sram,rob} share slots) and keys the per-scope timing at every level.</text>
