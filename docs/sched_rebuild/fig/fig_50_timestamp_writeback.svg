  <text x="1020" y="792" font-size="10" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">sideband return (no gate)</text>
  <text x="40" y="843" font-size="13" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">reading it:</text>
  <text x="40" y="865" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Each issued cmd stamps `next_x = GC + const` into the scope reg for the relationship it constrains. A later cmd is legal when GC &gt;= its next_x.</text>
  <text x="40" y="885" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Same value, different scope: CAS-&gt;CAS diff-BG = tCCD_S=8 = dqFree (GLOBAL); CAS-&gt;CAS same-BG = tCCD_L/L_WR (BG). Use whichever scope the pair falls in.</text>
  <text x="40" y="905" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Cross-bank constraints are WRITTEN into the shared scope reg at issue (stage 6): e.g. ACT writes the BG's next_act (tRRD_L) that all 4 banks read.</text>
  <text x="40" y="925" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">tFAW = rolling 4-ACT window per rank (faw_ts[4]); WR-&gt;RD tWTR measured from end of write burst (L=same-BG 24, S=diff-BG 6); turnaround REPLACES dqFree at a flip.</text>
  <text x="40" y="961" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">The timestamp path = this writeback. On each of the &lt;=3 issued cmds (+ref), stamp next_* at bank/BG/rank/global per the table; comparators turn next_* into the can_* gates the arb reads. ref writes gate_rfc (a +tRFCsb timestamp) - it's in this path too.</text>
</svg>
