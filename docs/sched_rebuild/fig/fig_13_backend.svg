<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="790" viewBox="0 0 1260 790" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1260" height="790" fill="#ffffff"/>
  <text x="1250" y="30" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">MC back-end  -  cmd packer + data engines + completion</text>
  <text x="1250" y="46" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">two concurrent engines, not one time-shared block</text>
  <line x1="800" y1="205" x2="800" y2="560" stroke="#777777" stroke-width="1.0" stroke-dasharray="5 4"/>
  <text x="500" y="196" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">SRAM side  -  512b / line, gear-agnostic</text>
  <text x="1000" y="196" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">DFI side  -  2*gear beats / mc_clk</text>
  <rect x="120" y="70" width="260" height="92" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="250.0" y="92" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">PHASE_PACKER</text>
  <text x="250.0" y="107" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">cmd only - gear 1:N - sole commit/arm edge</text>
  <text x="112" y="116" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#000000">from RANK_ARB</text>
  <text x="112" y="132" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#000000">(L3 winner)</text>
  <line x1="30" y1="124" x2="118" y2="124" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="382" y1="108" x2="540" y2="108" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="540" y="100" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#000000">dfi_cmd  -&gt;  DFI_MUX</text>
  <line x1="250" y1="162" x2="250" y2="186" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="262" y="178" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">{op, rob_index, sram_addr}  @ CAS-commit</text>
  <path d="M250 186.0 L310.0 214 L250 242.0 L190.0 214 Z" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="250" y="219" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">op ?</text>
  <path d="M310 214 L505 214 L505 250" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="420" y="206" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">WR: arm WL_line</text>
  <path d="M250 242 L250 420 L505 420" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="262" y="350" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">RD: arm RL_line</text>
  <rect x="110" y="300" width="130" height="60" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="175" y="326" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">WD_SRAM</text>
  <text x="175" y="344" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">512b / line</text>
  <rect x="505" y="232" width="48" height="38" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="553" y="232" width="48" height="38" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="601" y="232" width="48" height="38" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="649" y="232" width="48" height="38" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="505" y="222" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">WL_line   depth = CWL</text>
  <line x1="529" y1="270" x2="529" y2="328" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="541" y="296" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">fire @ slot0 -&gt; wd_slot</text>
  <rect x="560" y="300" width="210" height="62" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="665.0" y="331.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">BURST_SPLIT</text>
  <text x="665.0" y="346.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">512b -&gt; serialize 2*gear</text>
  <line x1="240" y1="330" x2="558" y2="330" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="393" y1="337" x2="407" y2="323" stroke="#000000" stroke-width="1.0"/>
  <text x="410" y="346" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">512b</text>
  <text x="408" y="318" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">WR_DATA_FETCH:  1x512b read @ wd_slot</text>
  <line x1="772" y1="330" x2="1060" y2="330" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="913" y1="337" x2="927" y2="323" stroke="#000000" stroke-width="1.0"/>
  <text x="930" y="346" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">2*gear</text>
  <text x="928" y="318" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">dfi_wrdata (self-timed)</text>
  <rect x="110" y="470" width="130" height="60" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="175" y="496" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">RD_SRAM</text>
  <text x="175" y="514" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">512b / line</text>
  <rect x="505" y="402" width="48" height="38" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="553" y="402" width="48" height="38" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="601" y="402" width="48" height="38" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <rect x="649" y="402" width="48" height="38" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="505" y="392" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">RL_line   depth = CL</text>
  <line x1="529" y1="440" x2="529" y2="498" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="541" y="466" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">fire @ slot0 -&gt; dbuf_addr</text>
  <rect x="560" y="470" width="210" height="62" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="665.0" y="501.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">BURST_ACC</text>
  <text x="665.0" y="516.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">deserialize 2*gear -&gt; gather 64B</text>
  <line x1="558" y1="500" x2="242" y2="500" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="393" y1="507" x2="407" y2="493" stroke="#000000" stroke-width="1.0"/>
  <text x="410" y="516" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">512b</text>
  <text x="408" y="488" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">RD_DATA_SEND:  1x512b write @ dbuf_addr</text>
  <line x1="1060" y1="500" x2="772" y2="500" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="913" y1="507" x2="927" y2="493" stroke="#000000" stroke-width="1.0"/>
  <text x="930" y="516" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">2*gear</text>
  <text x="928" y="488" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">dfi_rddata (+valid)</text>
  <rect x="560" y="640" width="240" height="74" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="680.0" y="662" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">COMPLETION</text>
  <text x="680.0" y="677" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">rd_done | wr_done -&gt; {rob_index,pkt_num,status}</text>
  <path d="M665 362 L665 500 L665 640" fill="none" stroke="#777777" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="676" y="600" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">rd_done (last beat in RD_SRAM)</text>
  <path d="M700 362 L700 638" fill="none" stroke="#777777" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="712" y="420" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">wr_done (self-timed, no ack)</text>
  <rect x="860" y="652" width="150" height="60" fill="#e3f2f1" stroke="#000000" stroke-width="1.4"/>
  <text x="935" y="676" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">RESP_AFIFO</text>
  <text x="935" y="694" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">async out</text>
  <line x1="800" y1="678" x2="858" y2="678" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="1010" y1="678" x2="1100" y2="678" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="1108" y="674" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000">=async=&gt; CIF</text>
  <rect x="1040" y="560" width="200" height="52" fill="none" stroke="#777777" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="1140" y="582" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">ALERT_n MON  (stub)</text>
  <text x="1140" y="598" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">write-CRC/parity -&gt; status</text>
  <path d="M1100 560 L1100 330" fill="none" stroke="#777777" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="1112" y="450" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">dfi_alert_n</text>
  <path d="M1040 586 L800 586 L800 677" fill="none" stroke="#777777" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="30" y="640" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#7a5cb8" font-weight="bold">SLOTS = CIF-owned:</text>
  <text x="30" y="658" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#7a5cb8">CIF allocs dbuf_addr + wd_slot, rides them in;</text>
  <text x="30" y="674" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#7a5cb8">MC never allocs. rd_done/wr_done -&gt; CIF drains</text>
  <text x="30" y="690" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#7a5cb8">RD_SRAM / frees WD_SRAM slot.</text>
  <text x="30" y="770" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">PHASE_PACKER arms the data line at CAS-commit with the sram_addr that rode the pipe; WRITE (SRAM-&gt;DFI, WL=CWL) and READ (DFI-&gt;SRAM, RL=CL) are two concurrent engines - the op-code only routes which line arms. RL/WL depth = the timing (no timestamp/CAM). Slots freed by CIF on done.</text>
</svg>
