  <text x="620" y="686" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">-&gt;  packer  -&gt;  one shared issue path</text>
  <rect x="1120" y="92" width="200" height="420" fill="none" stroke="#777777" stroke-width="1.0"/>
  <text x="1220" y="116" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000" font-weight="bold">instance count</text>
  <text x="1132" y="160" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">per_bank_decoder</text>
  <text x="1132" y="176" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">x1  (shared)</text>
  <text x="1132" y="240" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">cell[{rank,bank}]</text>
  <text x="1132" y="256" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">N_RANKS x 32 = 64/128</text>
  <text x="1132" y="320" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">bg_arb  (L1)</text>
  <text x="1132" y="336" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">N_RANKS x 8 = 16/32</text>
  <text x="1132" y="400" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">rank_arb  (L2)</text>
  <text x="1132" y="416" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">N_RANKS = 2/4</text>
  <text x="1132" y="480" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">inter_rank_arb (L3)</text>
  <text x="1132" y="496" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">x1</text>
  <text x="40" y="748" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">The decoder-&gt;L2 path is ONE rank subtree {32 cells -&gt; 8 bg_arb -&gt; 1 rank_arb}, instanced x N_RANKS. One shared decoder feeds them; L3 collects the N_RANKS winners into one issue path.</text>
