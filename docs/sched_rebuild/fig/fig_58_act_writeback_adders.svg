  <text x="1080" y="66" font-size="8" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">RESET (block now, reset-dominant) -&gt; every SR this issue writes</text>
  <text x="40" y="858" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ACT stamps 3 bank + 1 BG + 2 rank in one mc_clk: 6 parallel adders, each GC_ph + a CONST_BANK tap (fixed wire, or 3:1 mux where the adder is shared across cmds). act_issue write-enables the regs AND resets the can_* SR flops; each GE re-sets can_* at GC &gt;= next_*.</text>
