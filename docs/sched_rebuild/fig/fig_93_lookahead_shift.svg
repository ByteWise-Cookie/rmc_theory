  <text x="40" y="470" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">elig[i]=vld_i &amp; bank_rdy_vec[bank_ei]. p_encoder -&gt; lowest set = served_idx -&gt; issue that slot (head if ready, else younger bypasses). COMPACT-REMOVE pulls entries ABOVE served down 1; freed top loads new entry. Order free: same-bank entries share one bank_rdy bit + lowest-index -&gt; younger same-bank never passes older. elig==0 -&gt; hold (bubble).</text>
