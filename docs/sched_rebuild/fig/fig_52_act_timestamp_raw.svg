  <text x="724" y="277" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">next_pre[13]</text>
  <text x="716" y="356" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">1 row = 1 bank; WE selects the winner</text>
