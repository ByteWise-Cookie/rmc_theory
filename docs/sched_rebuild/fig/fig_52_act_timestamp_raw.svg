  <text x="40" y="58" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ACT grant -&gt; stamp bank next_act/cas/pre = (GC+phase_off)+const -&gt; comparators -&gt; can_* (1-bit each). Per-bank regs+cmps, x32. Optimize later.</text>
