  <rect x="1160" y="259" width="90" height="26" fill="#efe6fb" stroke="#000000" stroke-width="1.4"/>
  <text x="1205" y="277" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">can_pre</text>
  <line x1="1250" y1="272" x2="1300" y2="272" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <path d="M120 282 V470 H1075 V284" fill="none" stroke="#000000" stroke-width="1.0" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="700" y="462" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">GC broadcast to all comparators</text>
  <text x="1300" y="232" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#000000">-&gt; ARB</text>
  <text x="1160" y="300" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">1-bit flops (can_act/cas/pre) - 3 x 32 per rank</text>
  <text x="716" y="400" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ACT also: state ACTING-&gt;OPEN (after tRCD), open_row&lt;-row</text>
  <text x="40" y="668" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">RAW: ACT grant decodes to one bank; (GC+phase_off) feeds three adders (+tRC/tRCD/tRAS) that load that bank's next_act/cas/pre; every bank's three deadlines run a GC&gt;=next comparator each cycle -&gt; can_act/cas/pre 1-bit flops to the arb. 3x32 comparators/rank - shared const table, no other sharing yet.</text>
