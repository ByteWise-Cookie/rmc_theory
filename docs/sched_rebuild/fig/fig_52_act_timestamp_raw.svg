  <text x="1372" y="232" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#000000">-&gt; ARB</text>
  <text x="1224" y="300" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">can_* = SR flop: RESET on issue, SET on deadline (x3 x32/rank)</text>
  <text x="490" y="440" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ACT also: state ACTING-&gt;OPEN (after tRCD), open_row&lt;-row</text>
  <text x="40" y="668" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">RAW: ACT grant decodes to one bank; (GC+phase_off) feeds three adders (+tRC/tRCD/tRAS) that load that bank's next_act/cas/pre. can_* is a reset-dominant SR flop: the issue-decode RESETS it (block now), the GC&gt;=next comparator SETS it when the deadline passes (&gt;=, never ==, or gear skips it). 3x32 flops+cmps/rank; shared const table.</text>
