<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="40" y="32" font-size="15" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#000000" font-weight="bold">REFsb engine  (bank k across all 8 BGs = 8 banks)</text>
  <rect x="40" y="82" width="250" height="74" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="290" y="74" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">GC upper-slice compare</text>
  <text x="290" y="58" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">hit = GC[20:7] &gt;= ref_ts[20:7]</text>
  <text x="48" y="168" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">ref_ts += tREFI (full add, no drift)</text>
  <text x="48" y="182" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">temp: &gt;&gt; rr_shift (1x/2x/4x)</text>
  <circle cx="120" cy="250" r="34" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="120" y="250" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">debt</text>
  <text x="120" y="264" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#777777">3b, sat 7</text>
  <line x1="160" y1="156" x2="130" y2="216" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="150" y="200" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">hit -&gt; debt++</text>
  <text x="200" y="235" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#b0602a">&amp;debt (==7) -&gt; force</text>
  <text x="200" y="253" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">debt&gt;0 &amp; idle -&gt; opp</text>
  <rect x="40" y="320" width="220" height="60" fill="none" stroke="#000000" stroke-width="1.6"/>
  <text x="260" y="312" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="end" fill="#777777">target RR</text>
  <text x="260" y="296" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">ba 0-&gt;3 , rank_sel</text>
  <line x1="120" y1="276" x2="120" y2="318" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="128" y="300" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">trigger</text>
  <text x="48" y="400" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">target = {rank, bank ba, BG0..7}</text>
  <rect x="440.0" y="158.0" width="120" height="44" fill="#ffffff" stroke="#000000" stroke-width="1.6" rx="10"/>
  <text x="500" y="185" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">IDLE</text>
  <rect x="660.0" y="158.0" width="120" height="44" fill="#e9f0dc" stroke="#000000" stroke-width="1.6" rx="10"/>
  <text x="720" y="185" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">PICK</text>
  <rect x="880.0" y="158.0" width="120" height="44" fill="#e3f2f1" stroke="#000000" stroke-width="1.6" rx="10"/>
  <text x="940" y="185" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">DRAIN</text>
  <rect x="880.0" y="338.0" width="120" height="44" fill="#efe6fb" stroke="#000000" stroke-width="1.6" rx="10"/>
  <text x="940" y="365" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">ISSUE</text>
  <rect x="660.0" y="338.0" width="120" height="44" fill="#e9f0dc" stroke="#000000" stroke-width="1.6" rx="10"/>
  <text x="720" y="365" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">REFING</text>
  <rect x="440.0" y="338.0" width="120" height="44" fill="#e9f0dc" stroke="#000000" stroke-width="1.6" rx="10"/>
  <text x="500" y="365" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">release</text>
  <path d="M560 180 L660 180" fill="none" stroke="#7a4fb0" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="585" y="168" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#7a4fb0">debt&gt;0</text>
  <path d="M780 180 L880 180" fill="none" stroke="#7a4fb0" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="770" y="168" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#7a4fb0">set REF_pending[8]</text>
  <path d="M940 202 L940 338" fill="none" stroke="#2a8f86" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="955" y="270" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#2a8f86">refsb_ready (8-AND)</text>
  <path d="M880 360 L780 360" fill="none" stroke="#7a4fb0" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="775" y="350" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#7a4fb0">REFsb(ba)</text>
  <path d="M660 360 L560 360" fill="none" stroke="#2a8f86" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="545" y="350" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#2a8f86">GC&gt;=gate_rfc (tRFCsb)</text>
  <path d="M500 338 L500 202" fill="none" stroke="#b0602a" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="470" y="270" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#b0602a">debt--, ba++</text>
  <text x="940" y="240" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">DRAIN: freeze admit (row_valid=0),</text>
  <text x="940" y="254" font-size="8" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#777777">finish hit-train (policy B), PRE -&gt; IDLE</text>
  <text x="500" y="540" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">ref_rdy[b] = (state==IDLE)   for bank k in BG0..7</text>
  <rect x="470" y="560" width="26" height="30" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="483" y="580" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">0</text>
  <line x1="483" y1="590" x2="780" y2="640" stroke="#aaaaaa" stroke-width="1.0"/>
  <rect x="504" y="560" width="26" height="30" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="517" y="580" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">1</text>
  <line x1="517" y1="590" x2="780" y2="640" stroke="#aaaaaa" stroke-width="1.0"/>
  <rect x="538" y="560" width="26" height="30" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="551" y="580" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">2</text>
  <line x1="551" y1="590" x2="780" y2="640" stroke="#aaaaaa" stroke-width="1.0"/>
  <rect x="572" y="560" width="26" height="30" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="585" y="580" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">3</text>
  <line x1="585" y1="590" x2="780" y2="640" stroke="#aaaaaa" stroke-width="1.0"/>
  <rect x="606" y="560" width="26" height="30" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="619" y="580" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">4</text>
  <line x1="619" y1="590" x2="780" y2="640" stroke="#aaaaaa" stroke-width="1.0"/>
  <rect x="640" y="560" width="26" height="30" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="653" y="580" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">5</text>
  <line x1="653" y1="590" x2="780" y2="640" stroke="#aaaaaa" stroke-width="1.0"/>
  <rect x="674" y="560" width="26" height="30" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="687" y="580" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">6</text>
  <line x1="687" y1="590" x2="780" y2="640" stroke="#aaaaaa" stroke-width="1.0"/>
  <rect x="708" y="560" width="26" height="30" fill="#e9f0dc" stroke="#000000" stroke-width="1.4"/>
  <text x="721" y="580" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">7</text>
  <line x1="721" y1="590" x2="780" y2="640" stroke="#aaaaaa" stroke-width="1.0"/>
  <text x="470" y="552" font-size="8" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">ref_rdy  BG0..7 (bank k)</text>
  <rect x="760" y="630" width="120" height="44" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="820.0" y="652" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">8-AND</text>
  <line x1="880" y1="652" x2="960" y2="652" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="966" y="648" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#2a8f86">refsb_ready[k]</text>
  <text x="966" y="668" font-size="8" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">-&gt; DRAIN done -&gt; ISSUE</text>
  <rect x="1080" y="560" width="360" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="1260" y="584" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">writeback (8 target banks)</text>
  <text x="1096" y="612" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">REF_pending[8] &lt;- 1   (freeze admit)</text>
  <text x="1096" y="632" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">state[8] -&gt; REFING</text>
  <text x="1096" y="652" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">gate_rfc[8] = GC + tRFCsb (312)</text>
  <text x="1096" y="672" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#000000">release: GC&gt;=gate_rfc -&gt; IDLE, debt--</text>
  <text x="1096" y="692" font-size="9" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="start" fill="#7a4fb0">ref_rdy FLAG -&gt; scheduler (override inject)</text>
  <text x="40" y="760" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">REFsb(ba=k) targets bank k in ALL 8 BGs = 8 banks (diff-BG = drain-optimal, tCCD_S). refsb_ready = AND of 8 (not OR - all must be precharged).</text>
  <text x="40" y="780" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Interval = GC upper-slice compare (reuse 24b GC): hit=GC[20:7]&gt;=ref_ts[20:7], ref_ts+=tREFI full-add (no drift), debt=3b, force=&amp;debt. No 2nd counter, no wide compare.</text>
  <text x="40" y="800" font-size="9" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">Trigger: opportunistic (8 idle &amp; debt&gt;0) or forced (debt==7). Drain ~406 CK &lt;&lt; tREFI 9360 (4680 at 2x). ME emits ref_rdy; scheduler ranks with demand.</text>
  <text x="40" y="872" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">REFsb: tREFI-&gt;debt (temp-scaled); pick ba (RR) -&gt; set REF_pending on the 8 target banks -&gt; freeze admit + policy-B drain -&gt; 8-AND ref_rdy = refsb_ready -&gt; REFsb issue (gate_rfc[8] = GC+tRFCsb) -&gt; release at GC&gt;=gate_rfc, debt--, ba++. ME flag override-injects at the phaser.</text>
</svg>
