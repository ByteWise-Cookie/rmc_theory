<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="880" viewBox="0 0 1300 880" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1300" height="880" fill="#ffffff"/>
  <text x="430" y="56" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">from head_mux (lookahead)</text>
  <line x1="430" y1="64" x2="430" y2="92" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <rect x="300" y="92" width="470" height="58" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="535.0" y="121.0" font-size="13" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">per_bank_decoder</text>
  <text x="535.0" y="136.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">1 request -&gt; cell[{rank,bank}]   (64-way one-hot)</text>
  <path d="M540 150 L825 150 L825 204" fill="none" stroke="#7a5cb8" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="825" y="174" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#7a5cb8">decode this cycle</text>
  <text x="70" y="196" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">rank 0   -   32 cells  cell[{0, bank}]</text>
  <rect x="70" y="206" width="190" height="76" fill="#efe6fb" stroke="#000000" stroke-width="1.4"/>
  <text x="165" y="228" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">cell[{0,5}]</text>
  <text x="165" y="247" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">OPEN -&gt; MISS</text>
  <text x="165" y="266" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">need_pre -&gt; PRE</text>
  <rect x="290" y="206" width="190" height="76" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="385" y="228" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">cell[{0,6}]</text>
  <text x="385" y="247" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">OPEN, row hit</text>
  <text x="385" y="266" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">need_cas -&gt; RD</text>
  <text x="560" y="246" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">... x30 cells</text>
  <text x="730" y="196" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">rank 1   -   32 cells  cell[{1, bank}]</text>
  <rect x="730" y="206" width="190" height="76" fill="#efe6fb" stroke="#000000" stroke-width="1.4"/>
  <text x="825" y="228" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">cell[{1,5}]</text>
  <text x="825" y="247" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">OPEN -&gt; MISS</text>
  <text x="825" y="266" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">need_pre -&gt; PRE</text>
  <rect x="950" y="206" width="190" height="76" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="1045" y="228" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000" font-weight="bold">cell[{1,6}]</text>
  <text x="1045" y="247" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#777777">IDLE</text>
  <text x="1045" y="266" font-size="11" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">need_act -&gt; ACT</text>
  <text x="1195" y="244" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">... x30</text>
  <text x="70" y="300" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">all 64 cells LIVE every cycle - each emits its ONE state-picked cmd (L0)</text>
  <line x1="1280" y1="336" x2="1150" y2="336" stroke="#7a5cb8" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="1215" y="326" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#7a5cb8">bank_rdy[64]</text>
  <text x="1215" y="352" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#7a5cb8">+ can_* (fig_04)</text>
  <path d="M160 360 L420 360 L397.5 410 L182.5 410 Z" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="290.0" y="389.0" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">bg_arb[r0]</text>
  <path d="M820 360 L1080 360 L1057.5 410 L842.5 410 Z" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="950.0" y="389.0" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">bg_arb[r1]</text>
  <line x1="165" y1="282" x2="165" y2="360" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="385" y1="282" x2="385" y2="360" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="825" y1="282" x2="825" y2="360" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <line x1="1045" y1="282" x2="1045" y2="360" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="160" y="432" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">L1  -  4 banks within a BG, per rank  (x8 BG)</text>
  <line x1="290" y1="410" x2="290" y2="470" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <path d="M190 470 L390 470 L367.5 520 L212.5 520 Z" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="290.0" y="499.0" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">rank_arb[r0]</text>
  <line x1="950" y1="410" x2="950" y2="470" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <path d="M850 470 L1050 470 L1027.5 520 L872.5 520 Z" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="950.0" y="499.0" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">rank_arb[r1]</text>
  <text x="190" y="542" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">L2  -  8 BGs -&gt; 1 winner per rank</text>
  <text x="430" y="500" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">rank0 winner</text>
  <text x="770" y="500" font-size="10" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">rank1 winner</text>
  <path d="M290 520 L500 520 L500 590" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <path d="M950 520 L740 520 L740 590" fill="none" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <path d="M470 590 L770 590 L745.7 644 L494.3 644 Z" fill="#f4f4f4" stroke="#000000" stroke-width="1.4"/>
  <text x="620.0" y="621.0" font-size="12" font-family="JetBrains Mono, DejaVu Sans Mono, monospace" text-anchor="middle" fill="#000000">inter_rank_arb</text>
  <text x="464" y="621.0" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="end" fill="#777777">tRTRS wt</text>
  <text x="300" y="668" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">L3  -  pick ACROSS ranks: skip tWTR on a rank hop, charge tRTRS; same rank -&gt; normal tCCD/tWTR</text>
  <line x1="620" y1="644" x2="620" y2="700" stroke="#000000" stroke-width="1.0" marker-end="url(#arw)"/>
  <text x="620" y="722" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="middle" fill="#000000">-&gt;  packer (bundle)</text>
  <text x="70" y="772" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">two diff-rank misses run in PARALLEL: both PRE share a bundle (tPPD=2), both ACT share a bundle (cross-rank = no tRRD);</text>
  <text x="70" y="788" font-size="12" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">only the two CAS serialize on the one DQ bus (~tRTRS apart).</text>
  <text x="40" y="858" font-size="11" font-family="Inter, DejaVu Sans, sans-serif" text-anchor="start" fill="#777777">L0 is per cell [rank][bank] - all 64 live, each emits its one state-picked cmd. Rank is chosen ONLY at L3; L1/L2 are per-rank subtrees, one shared issue path below.</text>
</svg>
